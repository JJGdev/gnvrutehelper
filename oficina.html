<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="robots" content="noindex">
<title>Oficina · GnvRuteHelper</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>

/* ============================================================
   1. COLORES Y MEDIDAS
   ============================================================ */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunken:#F4F6F9; --line:#E3E7ED; --line-2:#CBD2DC;
  --ink:#121620; --ink-2:#4A5466; --ink-3:#5E6879;
  --accent:#1656CC; --accent-2:#1859D6; --accent-press:#1249AE; --accent-soft:#E8F0FD; --accent-ink:#0D3C91; --on-accent-2:#E4EDFF;
  --ok:#14794A; --ok-soft:#E3F3EA;
  --warn:#965800; --warn-soft:#FFF3D9; --warn-line:#F0C674; --warn-ink:#573400;
  --danger:#B42318;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --tap:52px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sh-1:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --sh-2:0 2px 4px rgba(16,24,40,.05),0 10px 24px rgba(16,24,40,.08);
  --sh-hero:0 4px 8px rgba(16,24,40,.08),0 18px 32px -14px rgba(16,24,40,.45);
  --sh-pop:0 4px 10px rgba(16,24,40,.10),0 18px 40px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
html{touch-action:manipulation}                 /* sin zoom con doble toque */
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;text-size-adjust:100%}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   2. ESTRUCTURA
   ============================================================ */
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{background:var(--surface);padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 10px calc(16px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;position:relative;z-index:1000;box-shadow:0 1px 0 var(--line)}
.top .title{flex:1;min-width:0}
.top h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.top .sub{font-size:14px;color:var(--ink-3)}
.body{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0}
.list-pane{overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 32px;-webkit-overflow-scrolling:touch}
.map-pane{background:#E5E9EF}
#map{position:absolute;inset:0}
.app[data-view="list"] .map-pane{visibility:hidden}
.app[data-view="map"] .list-pane{visibility:hidden}
.tabs{display:flex;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;height:56px;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);font-weight:600;font-size:16px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent)}
@media (min-width:880px){
  .body{display:grid;grid-template-columns:minmax(380px,460px) 1fr}
  .pane{position:relative;inset:auto}
  .list-pane{height:100%;padding:18px 18px calc(32px + env(safe-area-inset-bottom,0px))}
  .app .map-pane,.app .list-pane{visibility:visible!important}
  .tabs{display:none}
}

/* ============================================================
   3. BOTONES
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:var(--r-sm);
  border:0;background:var(--sunken);font-weight:650;font-size:16px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;
  transition:transform .12s var(--ease-out),background-color .15s ease;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-press)}
.btn.line{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:0 14px;font-size:15px}
.btn.icon{width:44px;min-height:44px;padding:0;border-radius:22px;background:transparent}
.btn[disabled]{opacity:.55;pointer-events:none}
@media (hover:hover){.btn:hover{background:#E7EBF1}.btn.primary:hover{background:var(--accent-press)}.btn.icon:hover,.btn.ghost:hover{background:var(--sunken)}}
#btnRecalc{background:var(--accent-soft);color:var(--accent-ink)}
@media (max-width:600px){#btnRecalc span{display:none}#btnRecalc{width:44px;padding:0;border-radius:22px}}

/* ============================================================
   4. PANEL "SIGUIENTE" (lo más importante de la pantalla)
   ============================================================ */
.hero{background:var(--accent-2);color:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-hero);padding:18px 18px 16px;margin-bottom:22px;position:relative;overflow:hidden}
.hero .meta{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;color:var(--on-accent-2)}
.hero .pill{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:#fff;color:var(--accent);font-size:14px;font-weight:800}
.hero .tap{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:0;cursor:pointer}
.hero h2{font-size:28px;line-height:1.15;font-weight:750;margin:10px 0 4px;letter-spacing:-.02em;text-wrap:balance}
.hero .addr{color:var(--on-accent-2);font-size:16px}
.hero .walk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:16px;font-weight:600}
.hero .walk span{color:var(--on-accent-2);font-weight:500}
.hero .walk .ico{width:19px;height:19px}
.hero .notes{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r-sm);padding:10px 12px;margin-top:14px;font-size:15px;display:flex;gap:10px}
.hero .notes .ico{width:19px;height:19px;color:var(--warn);margin-top:1px}
.hero .notes p{margin:0}
.hero .notes p + p{margin-top:6px}
.hero .notes small{color:var(--warn);font-size:13px}
.hero .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.hero .actions .go{grid-column:1/-1;background:#fff;color:var(--accent);font-size:18px;min-height:56px;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.hero .actions .go:active{background:#EEF3FD}
.hero .actions .soft{background:rgba(255,255,255,.16);color:#fff}
.hero .actions .soft:active{background:rgba(255,255,255,.26)}
@media (hover:hover){.hero .actions .soft:hover{background:rgba(255,255,255,.24)}.hero .actions .go:hover{background:#F2F6FE}}
@media (min-width:420px){.hero .actions{grid-template-columns:1.4fr 1fr 1fr}.hero .actions .go{grid-column:auto}}
.hero .prog{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--on-accent-2)}
.hero .prog b{color:#fff}
.hero .prog .bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
.hero .prog .bar i{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-out)}
.hero.done{background:var(--ok);text-align:left}
.swap{animation:swap .3s var(--ease-out)}
@keyframes swap{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}

/* ============================================================
   5. LISTA
   ============================================================ */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec:first-child{margin-top:4px}
.sec h3{font-size:15px;font-weight:700;color:var(--ink);margin:0}
.sec span{font-size:14px;color:var(--ink-3)}
.rows{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.row{position:relative}
.row + .row::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--line)}
.row-main{width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;min-height:68px;background:none;border:0;text-align:left;cursor:pointer;transition:background-color .15s ease}
.row-main:active{background:var(--sunken)}
@media (hover:hover){.row-main:hover{background:#F8F9FB}}
.n{flex:none;width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:750;background:var(--accent-soft);color:var(--accent-ink)}
.row .txt{flex:1;min-width:0}
.row .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .addr{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .dist{flex:none;font-size:15px;font-weight:650;color:var(--ink-2);text-align:right;line-height:1.2}
.row .dist small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin-top:2px}
.row .chev{width:18px;height:18px;color:var(--line-2);margin-left:-2px}
.row.is-done .n{background:var(--ok-soft);color:var(--ok)}
.row.is-done .name{color:var(--ink-3)}
.row.is-skip .n,.row.is-nogeo .n{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.ncount{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--warn);margin-left:6px;vertical-align:1px}
.ncount .ico{width:15px;height:15px}

/* ============================================================
   6. FICHA DEL CLIENTE (hoja que sube desde abajo)
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:2500;background:rgba(14,18,28,.42);opacity:0;transition:opacity .3s var(--ease-drawer)}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:2600;margin:0 auto;max-width:560px;max-height:88vh;max-height:88dvh;background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sh-pop);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s var(--ease-drawer);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;padding:10px 0 4px;cursor:grab;touch-action:none}
.grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:6px 20px 22px}
.sh-head{display:flex;gap:12px;align-items:flex-start}
.sh-head .n{margin-top:3px}
.sh-head h2{font-size:22px;line-height:1.3;margin:0;letter-spacing:-.015em;flex:1}
.sh-head .addr{color:var(--ink-3);font-size:15px;margin-top:3px}
.sh-head .btn.icon{margin:-6px -10px 0 0;color:var(--ink-3)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 6px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0;border:0;background:none;cursor:pointer;color:var(--accent-ink);font-size:13px;font-weight:650;text-decoration:none;text-align:center;line-height:1.2}
.qa .c{width:52px;height:52px;border-radius:26px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;transition:transform .12s var(--ease-out),background-color .15s ease}
.qa:active .c{transform:scale(.94)}
.qa.main .c{background:var(--accent);color:#fff}
.qa[aria-disabled="true"]{opacity:.4;pointer-events:none}
.state{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.state .btn{min-height:54px}
.state .full{grid-column:1/-1}
.sh-sec{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink-3);margin:26px 0 10px;text-transform:uppercase}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r-sm);padding:11px 12px;font-size:15px;margin-bottom:8px}
.note div{flex:1}
.note small{display:block;color:var(--warn);font-size:13px;margin-top:3px}
.note button{border:0;background:none;color:var(--warn);cursor:pointer;padding:4px;border-radius:8px;margin:-4px -4px 0 0}
.note-form{display:flex;gap:8px}
.note-form .input{height:48px;font-size:16px}
.note-form .btn{min-height:48px}
.empty-notes{color:var(--ink-3);font-size:15px;margin:0 0 10px}
.daypick{border:0;background:none;padding:2px 0;font:inherit;font-size:14px;color:var(--accent);font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.daypick .ico{width:16px;height:16px}
.dias{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:8px;margin-top:4px}
.dia{border:0;border-radius:var(--r-sm);background:var(--sunken);padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);
  transition:transform .12s var(--ease-out),background-color .15s ease}
.dia:active{transform:scale(.96)}
.dia b{font-size:15px;text-transform:capitalize}
.dia span{font-size:13px;color:var(--ink-3)}
.dia.sel{background:var(--accent);color:#fff}
.dia.sel span{color:var(--on-accent-2)}
.inline{border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0;cursor:pointer}
.install-steps{margin:18px 0 0;padding:0;list-style:none;counter-reset:paso}
.install-steps li{counter-increment:paso;display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:16px}
.install-steps li::before{content:counter(paso);flex:none;width:28px;height:28px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:center}
.install-steps .ico{width:20px;height:20px;vertical-align:-4px;color:var(--accent)}
.pinfix{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3);text-align:center}
.pinfix span{grid-column:1/-1}
.pinfix button{border:0;background:none;color:var(--accent);font-weight:650;font-size:15px;min-height:44px;padding:0 6px;cursor:pointer;border-radius:8px}
.pinfix button:active{background:var(--accent-soft)}

/* ============================================================
   7. ESTADOS: vacío, cargando, avisos, sincronización
   ============================================================ */
.empty{max-width:440px;margin:6vh auto 0;text-align:center;padding:0 8px}
.empty .icon-line{color:var(--accent);margin-bottom:12px}
.empty .icon-line .ico{width:36px;height:36px;stroke-width:1.75}
.empty h2{font-size:24px;margin:0 0 8px;letter-spacing:-.015em}
.empty p{color:var(--ink-2);margin:0 0 22px}
.empty .stack{display:grid;gap:10px}
.empty .stack .btn:not(.primary){background:var(--surface);box-shadow:var(--sh-1)}
.empty small{display:block;color:var(--ink-3);font-size:14px;margin-top:16px}
.loading{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px}
.loading h2{font-size:18px;margin:0 0 4px}
.loading p{color:var(--ink-2);font-size:15px;margin:0 0 12px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-out)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;font-size:15px;margin-bottom:12px}
.notice .ico{color:var(--warn);margin-top:1px}
.notice.info{background:var(--accent-soft);color:var(--accent-ink)}
.notice.info .ico{color:var(--accent)}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink-3);margin:22px 2px 0}
.sync .ico{width:18px;height:18px}
.sync.off{color:var(--warn)}

/* ============================================================
   8. MENÚ, AVISOS FLOTANTES, ENTRADA Y MAPA
   ============================================================ */
.menu{position:absolute;right:12px;top:calc(100% + 6px);background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-pop);
  padding:6px;min-width:260px;transform-origin:top right;animation:pop .16s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.menu button{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;font-size:16px}
.menu button:active,.menu button:hover{background:var(--sunken)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:#1B202B;color:#fff;border-radius:14px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:14px;width:max-content;max-width:min(92vw,520px);
  box-shadow:var(--sh-pop);transition:opacity .2s var(--ease-out),transform .25s var(--ease-out);z-index:2800;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#9BBEFF;font-weight:700;cursor:pointer;padding:6px 4px;font-size:15px}
@media (min-width:880px){.toast{bottom:24px}}
.login{position:fixed;inset:0;z-index:3000;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:28px}
.login > *{flex:none}
.login-hero{position:relative;width:100%;background:var(--accent-2);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 24px 84px;overflow:hidden;
  border-radius:0 0 28px 28px;display:flex;justify-content:center}
.login-art{display:block;width:calc(100% + 16px);height:auto;margin:6px -8px 18px;overflow:visible}
.login-art .ria{fill:none;stroke:rgba(255,255,255,.08);stroke-width:30;stroke-linecap:round}
.login-art .calle{fill:none;stroke:rgba(255,255,255,.09);stroke-width:9}
.login-art .ruta{fill:none;stroke:rgba(255,255,255,.85);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 9;animation:ruta 1.6s var(--ease-out) both}
.login-art .parada circle{fill:#fff;stroke:var(--accent-2);stroke-width:3}
.login-art .hechas circle{fill:rgba(255,255,255,.55)}
.login-art .meta circle{fill:#fff}
.login-art .meta path{fill:none;stroke:var(--accent-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes ruta{from{stroke-dashoffset:120;opacity:0}to{stroke-dashoffset:0;opacity:1}}
.login-copy{position:relative;width:100%;max-width:440px}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:15px;letter-spacing:.01em;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px 6px 9px}
.wordmark .ico{width:18px;height:18px}
.login-copy h1{font-size:clamp(28px,7.5vw,38px);line-height:1.08;margin:0 0 8px;letter-spacing:-.025em;text-wrap:balance}
.login-copy p{margin:0;color:var(--on-accent-2);font-size:17px}
.login-card{position:relative;width:calc(100% - 32px);max-width:440px;margin-top:-56px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);
  padding:22px 20px 18px;animation:sube .5s var(--ease-out) both .08s}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:block;margin-bottom:14px;min-width:0}
.field > span:first-child{display:block;font-size:14px;font-weight:650;margin-bottom:6px;color:var(--ink-2)}
.field small{font-weight:400;color:var(--ink-3)}
.pw{position:relative;display:block}
.pw .input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--ink-3);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.eye[aria-pressed="true"]{color:var(--accent)}

.mk.skip{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.me{width:18px;height:18px;border-radius:50%;background:#2B7BFF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,123,255,.2),0 1px 4px rgba(0,0,0,.3)}

/* ============================================================
   PANEL DE OFICINA
   ============================================================ */
:root{--side:#F7F8FA;--row-hover:#F7F9FC;--d1:#1859D6;--d2:#0E8F7E;--d3:#B7591B;--d4:#7A47C9;--d5:#C2365B;--d6:#5E6879;--d7:#5E6879}
body.admin{font-size:15px}
.adm{position:fixed;inset:0;display:grid;grid-template-columns:248px 1fr;background:var(--bg)}
.adm[hidden]{display:none!important}
/* barra lateral */
.side{background:var(--side);box-shadow:inset -1px 0 0 var(--line);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font-weight:750;font-size:15px;letter-spacing:-.005em}
.brand img{width:30px;height:30px;border-radius:8px}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:9px;background:none;cursor:pointer;
  font-size:14.5px;font-weight:550;color:var(--ink-2);text-align:left;transition:background-color .15s ease,color .15s ease}
.nav button .ico{width:19px;height:19px}
.nav button:hover{background:#ECEFF4;color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px var(--line)}
.nav button[aria-current="page"] .ico{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:650;color:var(--ink-3)}
.side .grow{flex:1}
.me-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.avatar{width:32px;height:32px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);font-weight:750;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase}
.me-card .who{flex:1;min-width:0;line-height:1.35}
.me-card .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-card .who span{font-size:12.5px;color:var(--ink-3)}
.me-card .btn.icon{width:36px;min-height:36px;color:var(--ink-3)}
/* contenido */
.mainc{overflow-y:auto;min-width:0;overscroll-behavior:contain}
.page{max-width:1180px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) 32px 56px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph .t{flex:1;min-width:240px}
.ph h1{font-size:24px;line-height:1.3;margin:0;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--ink-3);font-size:14.5px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{border:0;background:none;padding:0;margin:0 0 6px;color:var(--ink-3);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.crumb:hover{color:var(--accent)}
.crumb .ico{width:16px;height:16px;transform:rotate(180deg)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:9px;gap:7px}
.btn.sm .ico{width:18px;height:18px}
.btn.out{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.out:hover{background:#F4F6F9}
.btn.danger{color:var(--danger)}
/* tira de cifras */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);margin-bottom:22px;overflow:hidden}
.stat{padding:16px 18px;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line)}
.stat span{display:block;font-size:13px;color:var(--ink-3);font-weight:550}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:4px;font-weight:700}
.stat b small{font-size:15px;color:var(--ink-3);font-weight:550;letter-spacing:0}
.stat.alert b{color:var(--warn)}
/* tarjetas y tablas */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);margin-bottom:22px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15.5px;margin:0;flex:1;min-width:140px}
.card-h .muted{font-size:13.5px;color:var(--ink-3)}
.card-b{padding:16px 18px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;font-weight:650;color:var(--ink-3);padding:10px 14px;background:#FAFBFC;border-bottom:1px solid var(--line);white-space:nowrap}
.t th:first-child,.t td:first-child{padding-left:18px}
.t th:last-child,.t td:last-child{padding-right:18px}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{transition:background-color .12s ease}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--row-hover)}
.t td.r{text-align:right}
.t td.num{font-variant-numeric:tabular-nums}
.t th.r{text-align:right}
.t .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.t .off td{color:var(--ink-3)}
.codeb{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;padding:0 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.02em}
.codeb.big{height:40px;min-width:62px;font-size:17px;border-radius:10px}
.prog{display:flex;align-items:center;gap:10px;min-width:180px}
.prog .bar{flex:1;height:7px;background:#E9EDF2}
.prog .bar i{background:var(--accent-2)}
.prog.ok .bar i{background:var(--ok)}
.prog span{font-size:13px;color:var(--ink-2);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12.5px;font-weight:650;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.badge::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.85}
.badge.plain::before{display:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:#FDECEA;color:var(--danger)}
.badge.info{background:var(--accent-soft);color:var(--accent-ink)}
.days{display:flex;gap:3px}
.days i{font-style:normal;display:inline-flex;flex-direction:column;align-items:center;min-width:24px;font-size:11px;color:var(--ink-3);line-height:1.35}
.days i b{font-size:13px;color:var(--ink);font-weight:650}
.days i.z b{color:var(--line-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:6px;vertical-align:0}
.attn{list-style:none;margin:0;padding:0}
.attn li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.attn li:last-child{border-bottom:0}
.attn li .ico{color:var(--warn);width:20px;height:20px}
.attn li div{flex:1}
.attn-ok{display:flex;align-items:center;gap:10px;padding:16px 18px;color:var(--ok);font-weight:600;font-size:14px}
/* barra de herramientas de tablas */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search .input{height:38px;padding-left:36px;font-size:14.5px;border-radius:9px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;height:32px;padding:0 10px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.seg button span{color:var(--ink-3);font-weight:500;margin-left:3px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.tabsb{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabsb button{border:0;background:none;height:46px;padding:0 10px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;box-shadow:inset 0 -2px 0 transparent;white-space:nowrap}
.tabsb button[aria-selected="true"]{color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tabsb button span{font-weight:500;margin-left:4px}
.amap{height:520px;background:#E5E9EF;position:relative}
.amap .legend{position:absolute;left:12px;bottom:12px;z-index:500;background:var(--surface);border-radius:10px;box-shadow:var(--sh-2);padding:8px 12px;font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.pinmk{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.emptyb{padding:36px 18px;text-align:center;color:var(--ink-3);font-size:14.5px}
.emptyb b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF1F5 0,#F6F8FA 50%,#EEF1F5 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.notes-l .nt{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.notes-l .nt:last-child{border-bottom:0}
.notes-l .nt div{flex:1}
.notes-l .nt small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
/* panel lateral (en escritorio) / hoja (en móvil) */
@media (min-width:900px){
  .adm-sheet{left:auto;top:0;right:0;bottom:0;margin:0;width:460px;max-width:none;max-height:none;border-radius:0;transform:translateX(100%);padding-bottom:0}
  .adm-sheet.show{transform:translateX(0)}
  .adm-sheet .grab{display:none}
  .adm-sheet .sheet-body{padding:22px 24px 28px;flex:1}
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-top:18px}
.form-grid .full{grid-column:1/-1}
select.input{padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.minimap{height:220px;border-radius:var(--r-sm);overflow:hidden;background:#E5E9EF;margin-top:6px;position:relative}
.pinrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3);margin-top:8px}
.pinrow .btn{min-height:34px;font-size:13.5px}
.sheet .field > span:first-child{font-size:13.5px}
.sheet .input{font-size:16px;height:46px}
.hint{font-size:13px;color:var(--ink-3);margin:-8px 0 14px}
.danger-zone{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rolecards label{display:block;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line-2);padding:12px;cursor:pointer;font-size:13px;color:var(--ink-3)}
.rolecards label b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.rolecards input{position:absolute;opacity:0;pointer-events:none}
.rolecards label:has(input:checked){box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.rolecards label:has(input:focus-visible){outline:2px solid var(--accent-2);outline-offset:2px}
/* responsive */
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3)::before{display:none}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:899px){
  .adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;gap:8px;overflow-x:auto}
  .brand{padding:0 6px 0 0}.brand small{display:none}
  .nav{flex-direction:row}
  .nav button{min-height:38px;white-space:nowrap}
  .nav .cnt{display:none}
  .side .grow{display:none}
  .me-card{padding:4px;box-shadow:none;background:none}.me-card .who{display:none}
  .page{padding:20px 14px 48px}
  .hide-m{display:none}
}
</style>

// ---------- Direcciones a coordenadas (OpenStreetMap / Nominatim, 1 consulta por segundo) ----------
async function buscarDireccion(c){
  const junta = (...p) => p.filter(Boolean).join(', ');
  const intentos = [junta(c.direccion, c.poblacion, 'Bizkaia', 'España'),
                    junta(c.direccion.replace(/\s+\d+\w*$/, ''), c.poblacion, 'Bizkaia', 'España')];
  for (let i = 0; i < intentos.length; i++){
    if (i) await pausa(1100);
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es&accept-language=es&q=' + encodeURIComponent(intentos[i]));
      if (!r.ok) continue;
      const j = await r.json();
      if (j[0]){
        const exacto = ['house','building','amenity','shop'].includes(j[0].addresstype) || j[0].category === 'amenity';
        return {lat:+j[0].lat, lng:+j[0].lon, geo: (i > 0 || !exacto) ? 'aprox' : 'ok'};
      }
    } catch { return null; }
  }
  return null;
}
async function ubicar(filas, progreso){
  let i = 0;
  for (const f of filas){
    i++;
    if (Number.isFinite(f.lat) && Number.isFinite(f.lng)){ f.geo = f.geo || 'ok'; continue; }
    if (!f.direccion){ f.geo = 'fail'; continue; }
    const k = addrKey(f);
    if (geoCache[k]){ Object.assign(f, geoCache[k]); continue; }
    progreso(i, filas.length, f.nombre);
    const r = await buscarDireccion(f);
    if (r){ Object.assign(f, r); geoCache[k] = r; store.set(KEY_GEO, geoCache); } else f.geo = 'fail';
    await pausa(1100);
  }
}

async function leerArchivo(file){
  let filas;
  if (/\.(xlsx|xls)$/i.test(file.name)){
    if (!window.XLSX){
      toast('Preparando el lector de Excel…');
      await new Promise((ok, ko) => { const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
    }
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
  } else filas = parseCSV(await file.text());
  return mapearColumnas(filas);
}
function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/, '');
  const primera = txt.split(/\r?\n/)[0] || '';
  const sep = (primera.match(/;/g)||[]).length >= (primera.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim()));
}
const DIAS = {lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6,domingo:7,l:1,m:2,x:3,j:4,v:5,s:6,d:7};
function mapearColumnas(filas){
  if (filas.length < 2) throw new Error('El archivo no tiene clientes');
  const cab = filas[0].map(norm);
  const busca = alias => { for (const a of alias){ const i = cab.indexOf(a); if (i > -1) return i; }
                           for (const a of alias){ const i = cab.findIndex(h => h.startsWith(a)); if (i > -1) return i; } return -1; };
  const col = {
    codigo: busca(['codigo','codcliente','cliente','cod','id']),
    nombre: busca(['nombrecomercial','nombre','establecimiento','razonsocial','name']),
    direccion: busca(['direccion','domicilio','calle','address']),
    poblacion: busca(['poblacion','municipio','localidad','ciudad']),
    telefono: busca(['telefono','tlf','tel','movil']),
    dia: busca(['diavisita','dia','diadevisita']),
    lat: busca(['latitud','lat','latitude']),
    lng: busca(['longitud','lng','lon','long','longitude'])
  };
  if (col.nombre < 0 || (col.direccion < 0 && col.lat < 0)) throw new Error('No encuentro las columnas de nombre y dirección');
  const val = (r, i) => i < 0 ? '' : String(r[i] ?? '').trim();
  const numero = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : undefined; };
  const dia = v => { const n = parseInt(v, 10); if (n >= 1 && n <= 7) return n; return DIAS[norm(v)] || null; };
  return filas.slice(1).map(r => ({
    codigo: val(r, col.codigo), nombre: val(r, col.nombre), direccion: val(r, col.direccion),
    poblacion: val(r, col.poblacion), telefono: val(r, col.telefono),
    dia_visita: dia(val(r, col.dia)), lat: numero(val(r, col.lat)), lng: numero(val(r, col.lng))
  })).filter(f => f.nombre);
}

function estadoHoy(r){

function vResumen(){
  const rs = R.rutas, fecha = new Intl.DateTimeFormat('es-ES', {weekday:'long', day:'numeric', month:'long'}).format(new Date(R.fecha + 'T12:00:00'));
  const prev = rs.reduce((a, r) => a + r.hoy, 0), hechos = rs.reduce((a, r) => a + r.hechos, 0);
  const sinUb = rs.reduce((a, r) => a + r.sin_ubicar, 0), disp = rs.reduce((a, r) => a + r.dispositivos, 0);

      ${rs.length ? `<div class="tw"><table class="t"><thead><tr><th>Ruta</th><th class="hide-m">Zona</th><th>Progreso</th><th class="r hide-m">Para luego</th><th class="hide-m">Última visita</th><th>Estado</th></tr></thead><tbody>
      ${rs.map(r => `<tr class="click" data-go="#/ruta/${esc(r.codigo)}/clientes">

        <td><div class="prog ${r.hoy && r.hechos >= r.hoy ? 'ok' : ''}"><div class="bar"><i style="transform:scaleX(${r.hoy ? Math.min(1, r.hechos/r.hoy) : 0})"></i></div><span>${r.hechos} / ${r.hoy}</span></div></td>

// ---------- DETALLE DE RUTA ----------
function vRuta(tab){
  const ru = RUTA.ruta, cs = RUTA.clientes, act = cs.filter(c => c.activo);
  const hoyD = R ? R.dia : ((new Date().getDay() + 6) % 7) + 1;
  const hoy = act.filter(c => !c.dia_visita || c.dia_visita === hoyD), hechos = hoy.filter(c => c.hoy === 'done').length;
  const sinUb = act.filter(c => !Number.isFinite(c.lat)).length;
  const tabs = [['clientes', 'Clientes', act.length], ['mapa', 'Mapa', ''], ['notas', 'Notas', RUTA.notas.length], ['cargas', 'Cargas de Excel', RUTA.cargas.length]];
  let cuerpo = '';
  if (tab === 'clientes') cuerpo = tClientes();
  else if (tab === 'mapa') cuerpo = `<div class="amap" id="mapaRuta"><div class="legend">${[1,2,3,4,5].filter(d => act.some(c => c.dia_visita === d)).map(d => `<span><i class="dot" style="background:${COLOR_DIA[d]}"></i>${NOMBRE_DIA[d]}</span>`).join('')}${act.some(c => !c.dia_visita) ? `<span><i class="dot" style="background:${COLOR_DIA[0]}"></i>sin día</span>` : ''}</div></div>`;
  else if (tab === 'notas') cuerpo = RUTA.notas.length ? `<div class="notes-l">${RUTA.notas.map(n => `<div class="nt"><div><b>${esc(n.cliente)}</b> · ${esc(n.texto)}<small>${esc(n.autor || 'Anónimo')} · ${hace(n.creada)}</small></div>
      <button class="btn sm out" data-act="borrarnota" data-id="${n.id}">Borrar</button></div>`).join('')}</div>` : `<div class="emptyb"><b>Sin notas</b>Las notas que escriban los comerciales en sus clientes aparecerán aquí.</div>`;
  else if (tab === 'cargas') cuerpo = RUTA.cargas.length ? `<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Archivo</th><th>Quién</th><th class="r">Clientes</th><th class="r">Bajas</th></tr></thead><tbody>
      ${RUTA.cargas.map(c => `<tr><td class="num">${new Intl.DateTimeFormat('es-ES', {dateStyle:'medium', timeStyle:'short'}).format(new Date(c.fecha))}</td><td>${esc(c.archivo || '—')}</td><td>${esc(c.usuario)}</td><td class="r num">${c.importados}</td><td class="r num">${c.bajas}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="emptyb"><b>Sin cargas registradas</b>Cada vez que se cargue un Excel quedará apuntado aquí: cuándo, quién y con qué archivo.</div>`;
  return `<button class="crumb" data-go="#/rutas">${ico('chevron')}Rutas</button>
    <div class="ph"><div class="t" style="display:flex;gap:14px;align-items:center">
        <span class="codeb big">${esc(ru.codigo)}</span>
        <div><h1>${esc(ru.nombre || 'Sin nombre')}</h1><p>${pl(act.length, 'cliente', 'clientes')} · hoy ${hechos} de ${hoy.length} visitados${sinUb ? ` · <span style="color:var(--warn);font-weight:650">${sinUb} sin ubicar</span>` : ''} · ${pl(ru.dispositivos, 'dispositivo conectado', 'dispositivos conectados')}</p></div></div>
      <div class="acts">
        <button class="btn sm primary" data-act="importar" data-id="${esc(ru.codigo)}">${ico('upload')}Cargar Excel</button>
        ${esAdmin() ? `<button class="btn sm out" data-act="editarruta" data-id="${esc(ru.codigo)}">${ico('key')}Acceso y datos</button>` : ''}
      </div></div>
    ${ru.bloqueada ? `<div class="notice">${ico('lock')}<div><b>Ruta bloqueada</b> por 5 intentos fallidos de buzón. Se desbloquea sola en 15 minutos.${esAdmin() ? ` <button class="inline" data-act="desbloquear" data-id="${esc(ru.codigo)}">Desbloquear ahora</button>` : ''}</div></div>` : ''}
    <div class="card"><div class="tabsb" role="tablist">${tabs.map(([id, t, n]) => `<button role="tab" aria-selected="${tab === id}" data-go="#/ruta/${esc(ru.codigo)}/${id}">${t}${n !== '' ? `<span class="num">${n}</span>` : ''}</button>`).join('')}</div>
      ${cuerpo}</div>`;
}
function filtrarClientes(){
  const q = norm(ui.q);
  return RUTA.clientes.filter(c => (ui.bajas || c.activo)
    && (ui.dia === 'todos' || (ui.dia === 'sindia' && !c.dia_visita) || (ui.dia === 'sinubicar' && !Number.isFinite(c.lat)) || +ui.dia === c.dia_visita)
    && (!q || norm(`${c.codigo} ${c.nombre} ${c.direccion}`).includes(q)));
}
function ubicacion(c){
  if (!Number.isFinite(c.lat)) return '<span class="badge warn">Sin ubicar</span>';
  if (c.geo === 'manual') return '<span class="badge info">Corregida</span>';
  if (c.geo === 'aprox') return '<span class="badge warn">Aproximada</span>';
  return '<span class="badge ok">Correcta</span>';
}
function tClientes(){
  const act = RUTA.clientes.filter(c => c.activo), lista = filtrarClientes();
  const cuenta = d => act.filter(c => c.dia_visita === d).length;
  const opciones = [['todos', 'Todos', act.length], ...[1,2,3,4,5,6,7].filter(d => cuenta(d)).map(d => [String(d), NOMBRE_DIA[d].slice(0, 3), cuenta(d)]),
    ...(act.some(c => !c.dia_visita) ? [['sindia', 'Sin día', act.filter(c => !c.dia_visita).length]] : []),
    ...(act.some(c => !Number.isFinite(c.lat)) ? [['sinubicar', 'Sin ubicar', act.filter(c => !Number.isFinite(c.lat)).length]] : [])];
  return `<div class="tools">
      <label class="search">${ico('search')}<input class="input" id="qClientes" placeholder="Buscar cliente, código o dirección" value="${esc(ui.q)}" autocomplete="off"></label>
      <div class="seg" role="group" aria-label="Filtrar por día">${opciones.map(([v, t, n]) => `<button data-act="filtro" data-id="${v}" aria-pressed="${ui.dia === v}">${t}<span class="num">${n}</span></button>`).join('')}</div>
      ${RUTA.clientes.some(c => !c.activo) ? `<label class="chk"><input type="checkbox" id="chkBajas" ${ui.bajas ? 'checked' : ''}>Ver dados de baja</label>` : ''}
    </div>
    ${lista.length ? `<div class="tw"><table class="t"><thead><tr><th class="hide-m">Código</th><th>Cliente</th><th>Día</th><th class="hide-m">Ubicación</th><th>Hoy</th><th class="r hide-m">Notas</th></tr></thead><tbody>
    ${lista.map(c => `<tr class="click ${c.activo ? '' : 'off'}" data-act="cliente" data-id="${c.id}">
      <td class="hide-m num">${esc(c.codigo)}</td>
      <td><b>${esc(c.nombre)}</b>${c.activo ? '' : ' <span class="badge plain">De baja</span>'}<span class="sub">${esc(c.direccion)}${c.poblacion ? ', ' + esc(c.poblacion) : ''}</span></td>
      <td>${c.dia_visita ? `<i class="dot" style="background:${COLOR_DIA[c.dia_visita]}"></i>${NOMBRE_DIA[c.dia_visita]}` : '<span style="color:var(--ink-3)">—</span>'}</td>
      <td class="hide-m">${ubicacion(c)}</td>
      <td>${c.hoy === 'done' ? '<span class="badge ok">Hecho</span>' : c.hoy === 'skipped' ? '<span class="badge warn">Para luego</span>' : '<span style="color:var(--ink-3)">—</span>'}</td>
      <td class="r num hide-m">${c.notas || ''}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="emptyb"><b>${act.length ? 'Ningún cliente coincide' : 'Esta ruta no tiene clientes'}</b>${act.length ? 'Cambia el filtro o la búsqueda.' : 'Cárgalos con «Cargar Excel».'}</div>`}`;
}
// Mapa de la ruta: un punto por cliente, del color de su día
function pintarMapaRuta(){
  const el = $('#mapaRuta'); if (!el || !window.L) return;
  if (ui.mapa){ ui.mapa.remove(); ui.mapa = null; }
  const m = ui.mapa = L.map(el).setView([43.2965, -2.989], 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(m);
  const pts = [];
  RUTA.clientes.filter(c => c.activo && Number.isFinite(c.lat)).forEach(c => {
    pts.push([c.lat, c.lng]);
    L.marker([c.lat, c.lng], {title:c.nombre, icon:L.divIcon({className:'', html:`<div class="pinmk" style="background:${COLOR_DIA[c.dia_visita || 0]}"></div>`, iconSize:[14,14], iconAnchor:[7,7]})})
      .addTo(m).bindTooltip(`<b>${esc(c.nombre)}</b><br>${esc(c.direccion)}${c.dia_visita ? ' · ' + NOMBRE_DIA[c.dia_visita] : ''}`).on('click', () => abrirHoja('cliente', c.id));
  });
  if (pts.length) m.fitBounds(pts, {padding:[40, 40], maxZoom:17});
}

// ---------- PANEL LATERAL ----------
function abrirHoja(tipo, id){
  ui.hoja = {tipo, id}; pintarHoja();
  $('#scrim').hidden = false; $('#sheet').hidden = false;
  requestAnimationFrame(() => { $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); });
}
function cerrarHoja(forzar){
  if (!forzar && ui.imp && ui.imp.trabajando) return;
  ui.hoja = null; ui.imp = null;
  if (ui.minimapa){ ui.minimapa.remove(); ui.minimapa = null; }
  $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show');
  setTimeout(() => { if (!ui.hoja){ $('#scrim').hidden = true; $('#sheet').hidden = true; } }, 380);
}
const cabeza = (t, sub) => `<div class="sh-head"><div style="flex:1;min-width:0"><h2 id="sheetTitle">${t}</h2>${sub ? `<div class="addr">${sub}</div>` : ''}</div>

    b.innerHTML = cabeza(r ? `Ruta ${esc(r.codigo)}` : 'Nueva ruta', r ? 'Acceso y datos de la ruta.' : 'El comercial entrará con este código y este buzón.') + `

        <label class="field"><span>Día de visita</span><select class="input" name="dia_visita"><option value="">Sin día</option>${[1,2,3,4,5,6,7].map(d => `<option value="${d}" ${c.dia_visita === d ? 'selected' : ''}>${NOMBRE_DIA[d]}</option>`).join('')}</select></label>
        <label class="field"><span>Estado</span><select class="input" name="activo"><option value="true" ${c.activo ? 'selected' : ''}>Activo</option><option value="false" ${c.activo ? '' : 'selected'}>De baja</option></select></label>
      </div>
      <div class="field"><span style="display:block;font-size:13.5px;font-weight:650;color:var(--ink-2)">Ubicación ${ubicacion(c)}</span>
        <div class="minimap" id="miniMapa">${window.L ? '' : '<div class="emptyb" style="padding:80px 12px">El mapa no está disponible sin conexión.</div>'}</div>
        <div class="pinrow"><span id="pinTxt">${Number.isFinite(c.lat) ? 'Arrastra el pin o toca el mapa para corregirlo.' : 'Toca el mapa donde está el cliente.'}</span>
          <button type="button" class="btn sm out" data-act="regeo">${ico('pin')}Ubicar por la dirección</button></div></div>
      <button class="btn primary" type="submit" style="width:100%;margin-top:10px">Guardar cambios</button></form>`;
    ui.pinTmp = Number.isFinite(c.lat) ? {lat:c.lat, lng:c.lng, geo:c.geo} : null;
    setTimeout(miniMapa, 60);
    return;
  }
  if (h.tipo === 'importar'){
    const r = R && R.rutas.find(x => x.codigo === h.id), im = ui.imp || {};
    let cuerpo;
    if (!im.filas) cuerpo = `
      <label class="field" style="margin-top:18px"><span>Población por defecto <small>· si el Excel no la trae</small></span>
        <input class="input" id="fPob" placeholder="Bilbao" value="${esc(im.pob || '')}"></label>
      <label class="drop" for="fFile">${ico('upload', 'width:30px;height:30px')}<b>Elegir el Excel o CSV</b><span>.xlsx, .xls o .csv · también puedes arrastrarlo aquí</span></label>
      <input type="file" id="fFile" accept=".xlsx,.xls,.csv,.txt" class="sr">
      ${im.error ? `<div class="notice" style="margin-top:14px">${ico('alert')}<div>${esc(im.error)}</div></div>` : ''}`;
    else if (im.trabajando) cuerpo = `
      <div class="loading" style="margin-top:18px;box-shadow:none;background:var(--sunken)"><h2>${esc(im.paso)}</h2>
        <p class="num">${esc(im.detalle || '')}</p><div class="bar"><i style="transform:scaleX(${im.pct || 0})"></i></div></div>
      <p class="hint" style="margin-top:12px">No cierres esta página. Las direcciones nuevas se buscan a una por segundo; las ya buscadas van al instante.</p>`;
    else if (im.resultado) cuerpo = `
      <div class="notice info" style="margin-top:18px">${ico('check')}<div><b>Ruta ${esc(h.id)} actualizada.</b> ${pl(im.resultado.importados, 'cliente cargado', 'clientes cargados')}${im.resultado.dados_de_baja ? `, ${im.resultado.dados_de_baja} dados de baja` : ''}.</div></div>
      <button class="btn primary" style="width:100%;margin-top:8px" data-go="#/ruta/${esc(h.id)}/clientes">Ver los clientes</button>`;
    else {
      const sinSitio = im.filas.filter(f => !Number.isFinite(f.lat)).length;
      const porDia = [1,2,3,4,5,6,7].map(d => [d, im.filas.filter(f => f.dia_visita === d).length]).filter(x => x[1]);
      cuerpo = `
      <div class="resumen"><div><b class="num">${im.filas.length}</b><span>clientes</span></div><div><b class="num">${im.filas.length - sinSitio}</b><span>ubicados</span></div>
        <div><b class="num ${sinSitio ? 'warn' : ''}">${sinSitio}</b><span>sin ubicar</span></div></div>
      ${porDia.length ? `<p class="hint" style="margin:0 0 8px">Por día: ${porDia.map(([d, n]) => `${NOMBRE_DIA[d]} ${n}`).join(' · ')}</p>` : `<div class="notice" style="margin:0 0 8px">${ico('calendar')}<div>El archivo no trae día de visita: el comercial verá todos los clientes juntos.</div></div>`}
      ${sinSitio ? `<p class="hint" style="margin:0 0 8px">${pl(sinSitio, 'dirección no encontrada', 'direcciones no encontradas')}. Se cargan igualmente y podréis colocarlas en el mapa.</p>` : ''}
      ${r && r.clientes ? `<p class="hint" style="margin:0 0 8px">Ahora la ruta tiene ${r.clientes} clientes. Los que no vengan en este archivo quedarán dados de baja.</p>` : ''}
      <ul class="preview">${im.filas.slice(0, 6).map(f => `<li><b>${esc(f.nombre)}</b><span>${esc(f.direccion)}${f.dia_visita ? ' · ' + NOMBRE_DIA[f.dia_visita] : ''}</span></li>`).join('')}
        ${im.filas.length > 6 ? `<li class="mas">y ${im.filas.length - 6} más…</li>` : ''}</ul>
      <button class="btn primary" style="width:100%;margin-top:16px" data-act="subir">${ico('upload')}Subir a la ruta ${esc(h.id)}</button>
      <button class="btn out" style="width:100%;margin-top:8px" data-act="otro">Elegir otro archivo</button>`;
    }
    b.innerHTML = cabeza(`Cargar clientes en ${esc(h.id)}`, esc(im.archivo || (r && r.nombre) || '')) + cuerpo;
    const f = $('#fFile'); if (f) f.addEventListener('change', e => leerYUbicar(e.target.files[0]));
    const d = $('.drop');
    if (d){ d.addEventListener('dragover', e => { e.preventDefault(); d.style.borderColor = 'var(--accent)'; });
            d.addEventListener('drop', e => { e.preventDefault(); leerYUbicar(e.dataTransfer.files[0]); }); }
    return;
  }
  if (h.tipo === 'usuario'){
    const u = h.id && USUARIOS ? USUARIOS.find(x => x.usuario === h.id) : null, yo = u && u.usuario === YO.usuario;
    b.innerHTML = cabeza(u ? esc(u.nombre || u.usuario) : 'Nuevo usuario', u ? `Usuario «${esc(u.usuario)}»` : 'Entrará en este panel con su usuario y su contraseña.') + `
      <form id="fUsuarioForm" style="margin-top:18px">
        <div class="rolecards" role="radiogroup" aria-label="Rol">
          <label><input type="radio" name="rol" value="coordinador" ${!u || u.rol === 'coordinador' ? 'checked' : ''} ${yo ? 'disabled' : ''}><b>Coordinador</b>Día a día: Excel, clientes, pines y notas.</label>
          <label><input type="radio" name="rol" value="admin" ${u && u.rol === 'admin' ? 'checked' : ''}><b>Administrador</b>Todo, incluidos usuarios y buzones.</label>
        </div>
        <div class="form-grid" style="margin-top:0">
          <label class="field"><span>Usuario</span><input class="input" name="usuario" value="${esc(u ? u.usuario : '')}" ${u ? 'readonly' : ''} placeholder="miren" autocapitalize="none" autocomplete="off" required></label>
          <label class="field"><span>Nombre</span><input class="input" name="nombre" value="${esc(u ? u.nombre : '')}" placeholder="Miren"></label>
          <label class="field full"><span>${u ? 'Contraseña nueva' : 'Contraseña'}</span><input class="input" name="clave" type="text" autocomplete="off" placeholder="${u ? 'Déjala vacía para no cambiarla' : 'Mínimo 4 caracteres'}"></label>
          ${u && !yo ? `<label class="field full"><span>Estado</span><select class="input" name="activo"><option value="true" ${u.activo ? 'selected' : ''}>Activo</option><option value="false" ${u.activo ? '' : 'selected'}>Desactivado (no puede entrar)</option></select></label>` : ''}
        </div>
        <button class="btn primary" type="submit" style="width:100%">${u ? 'Guardar cambios' : 'Crear usuario'}</button></form>
      ${u && !yo ? `<div class="danger-zone"><button class="btn out danger" style="width:100%" data-act="borrarusuario" data-id="${esc(u.usuario)}">${ico('trash')}Borrar este usuario</button></div>` : ''}`;
  }
}
// Mapa pequeño de la ficha del cliente: el pin se arrastra o se toca el mapa; se guarda con "Guardar cambios"
function miniMapa(){
  const el = $('#miniMapa'); if (!el || !window.L) return;
  if (ui.minimapa) ui.minimapa.remove();
  const c = RUTA.clientes.find(x => x.id === ui.hoja.id);
  const base = ui.pinTmp || (RUTA.clientes.find(x => Number.isFinite(x.lat)) || {lat:43.2965, lng:-2.989});
  const m = ui.minimapa = L.map(el, {zoomControl:false}).setView([base.lat, base.lng], ui.pinTmp ? 17 : 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(m);
  let mk = null;
  const poner = p => {
    if (!mk){ mk = L.marker([p.lat, p.lng], {draggable:true}).addTo(m); mk.on('dragend', e => { const q = e.target.getLatLng(); ui.pinTmp = {lat:q.lat, lng:q.lng, geo:'manual'}; avisoPin(); }); }
    else mk.setLatLng([p.lat, p.lng]);
  };
  if (ui.pinTmp) poner(ui.pinTmp);
  m.on('click', e => { ui.pinTmp = {lat:e.latlng.lat, lng:e.latlng.lng, geo:'manual'}; poner(ui.pinTmp); avisoPin(); });
  ui.ponerPin = p => { poner(p); m.setView([p.lat, p.lng], 17); };
}
const avisoPin = () => { const t = $('#pinTxt'); if (t) t.innerHTML = '<b style="color:var(--accent-ink)">Pin movido.</b> Pulsa «Guardar cambios» para aplicarlo.'; };

// ---------- Importar ----------
async function leerYUbicar(file){
  if (!file) return;
  const im = ui.imp = {pob: ($('#fPob') || {}).value || '', archivo: file.name};
  try {
    const filas = await leerArchivo(file);
    if (im.pob) filas.forEach(f => { if (!f.poblacion) f.poblacion = im.pob.trim(); });
    im.filas = filas; im.trabajando = true; im.paso = 'Buscando direcciones…'; pintarHoja();
    await ubicar(filas, (i, n, nombre) => { im.pct = i/n; im.detalle = `${i} de ${n} · ${nombre}`; pintarHoja(); });
    im.trabajando = false; pintarHoja();
  } catch (err){ ui.imp = {error: (err.message || 'No he podido leer el archivo') + '. Revisa que la primera fila tenga los títulos.', pob: im.pob}; pintarHoja(); }
}
async function subir(){
  const im = ui.imp, codigo = ui.hoja.id;
  im.trabajando = true; im.paso = 'Subiendo a la ruta…'; im.detalle = ''; im.pct = 1; pintarHoja();
  try {
    im.resultado = await rpc('oficina_importar', {p_token: TOKEN, p_codigo: codigo, p_archivo: im.archivo || '', p_clientes: im.filas.map(f => ({
      codigo: f.codigo, nombre: f.nombre, direccion: f.direccion, poblacion: f.poblacion, telefono: f.telefono,
      dia_visita: f.dia_visita || '', lat: Number.isFinite(f.lat) ? f.lat : '', lng: Number.isFinite(f.lng) ? f.lng : '', geo: f.geo || ''}))});
    im.trabajando = false; pintarHoja(); R = null; RUTA = null; pintar();
  } catch (e){ im.trabajando = false; pintarHoja(); tratarError(e); }
}

// ---------- Acciones ----------
async function accion(fn, args, ok){
  try { const r = await rpc(fn, {p_token: TOKEN, ...args}); if (ok) toast(typeof ok === 'function' ? ok(r) : ok); R = null; await pintar(); return true; }
  catch (e){ tratarError(e); return false; }
}
document.addEventListener('click', async e => {
  const go = e.target.closest('[data-go]');
  if (go){ if (go.dataset.filtro){ ui.filtroSig = go.dataset.filtro; ui.rutaCod = null; } return ir(go.dataset.go); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'close') return cerrarHoja();
  if (act === 'salir') return salir();
  if (act === 'refrescar'){ R = null; return pintar(); }
  if (act === 'nuevaruta') return abrirHoja('ruta', null);
  if (act === 'editarruta'){ if (!R) R = await rpc('oficina_resumen', {p_token: TOKEN}); return abrirHoja('ruta', id); }
  if (act === 'importar'){ ui.imp = null; if (!R) R = await rpc('oficina_resumen', {p_token: TOKEN}).catch(() => R); return abrirHoja('importar', id); }
  if (act === 'subir') return subir();
  if (act === 'otro'){ ui.imp = {pob: ui.imp && ui.imp.pob}; return pintarHoja(); }
  if (act === 'cliente') return abrirHoja('cliente', id);
  if (act === 'filtro'){ ui.dia = id; $('#page').innerHTML = vRuta('clientes'); return; }
  if (act === 'nuevousuario') return abrirHoja('usuario', null);
  if (act === 'editarusuario') return abrirHoja('usuario', id);
  if (act === 'desbloquear') return accion('oficina_desbloquear', {p_codigo: id}, `Ruta ${id} desbloqueada`).then(ok => ok && cerrarHoja(true));
  if (act === 'cerrarsesiones'){
    if (!confirm(`Todos los dispositivos que tengan abierta la ruta ${id} tendrán que volver a entrar con el buzón. ¿Seguir?`)) return;
    return accion('oficina_cerrar_sesiones', {p_codigo: id}, n => `${pl(n, 'sesión cerrada', 'sesiones cerradas')} en ${id}`).then(ok => ok && cerrarHoja(true));
  }
  if (act === 'borrarruta'){
    const t = prompt(`Se borrará la ruta ${id} con todos sus clientes, notas y visitas. No se puede deshacer.\n\nEscribe ${id} para confirmar:`);
    if ((t || '').trim().toUpperCase() !== id) return;
    cerrarHoja(true); return accion('oficina_borrar_ruta', {p_codigo: id}, `Ruta ${id} borrada`).then(() => ir('#/rutas'));
  }
  if (act === 'borrarnota'){ if (!confirm('¿Borrar esta nota para todos?')) return; return accion('oficina_borrar_nota', {p_nota: id}, 'Nota borrada'); }
  if (act === 'borrarusuario'){
    if (!confirm(`¿Borrar el usuario «${id}»? Dejará de poder entrar.`)) return;
    cerrarHoja(true); USUARIOS = null; return accion('oficina_borrar_usuario', {p_usuario: id}, 'Usuario borrado');
  }
  if (act === 'regeo'){
    const f = $('#fClienteForm'); const c = {direccion: f.direccion.value, poblacion: f.poblacion.value};
    el.disabled = true; const r = await buscarDireccion(c); el.disabled = false;
    if (!r) return toast('No encuentro esa dirección. Coloca el pin a mano.');
    ui.pinTmp = r; if (ui.ponerPin) ui.ponerPin(r); avisoPin();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qRutas'){ ui.q = e.target.value; const pos = e.target.selectionStart; $('#page').innerHTML = vRutas(); const n = $('#qRutas'); n.focus(); n.setSelectionRange(pos, pos); }
  if (e.target.id === 'qClientes'){ ui.q = e.target.value; const pos = e.target.selectionStart; $('#page').innerHTML = vRuta('clientes'); const n = $('#qClientes'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => { if (e.target.id === 'chkBajas'){ ui.bajas = e.target.checked; $('#page').innerHTML = vRuta('clientes'); } });
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  const boton = f.querySelector('[type=submit]'); if (boton) boton.disabled = true;
  try {
    if (f.id === 'loginForm'){
      const lbl = boton.querySelector('span'); lbl.textContent = 'Entrando…'; $('#loginError').textContent = '';
      try { await entrar(f.usuario.value, f.clave.value); f.clave.value = ''; $('#login').hidden = true; $('#app').hidden = false;
            if (esAdmin()) rpc('oficina_usuarios', {p_token: TOKEN}).then(u => { USUARIOS = u; pintarNav(); }).catch(() => {});
            pintar(); }
      catch (err){ $('#loginError').textContent = {DATOS_INCORRECTOS:'Usuario o contraseña incorrectos.', BLOQUEADO:'Demasiados intentos. Espera 15 minutos.', SIN_CONEXION:'No hay conexión.'}[err.message] || err.message; }
      lbl.textContent = 'Entrar';
    }
    if (f.id === 'fRutaForm'){
      const codigo = f.codigo.value.trim().toUpperCase();
      if (await accion('oficina_guardar_ruta', {p_codigo: codigo, p_nombre: f.nombre.value, p_buzon: f.buzon.value}, `Ruta ${codigo} guardada`)) cerrarHoja(true);
    }
    if (f.id === 'fClienteForm'){
      const d = {nombre: f.nombre.value, direccion: f.direccion.value, poblacion: f.poblacion.value, telefono: f.telefono.value,
                 dia_visita: f.dia_visita.value, activo: f.activo.value === 'true'};
      const c = RUTA.clientes.find(x => x.id === f.dataset.id);
      if (ui.pinTmp && (ui.pinTmp.lat !== c.lat || ui.pinTmp.lng !== c.lng)) Object.assign(d, {lat: String(ui.pinTmp.lat), lng: String(ui.pinTmp.lng), geo: ui.pinTmp.geo || 'manual'});
      try { await rpc('oficina_guardar_cliente', {p_token: TOKEN, p_id: f.dataset.id, p_datos: d}); toast('Cliente guardado'); cerrarHoja(true); RUTA = null; pintar(); }
      catch (err){ tratarError(err); }
    }
    if (f.id === 'fUsuarioForm'){
      const u = f.usuario.value.trim().toLowerCase(), rol = (f.querySelector('[name=rol]:checked') || {}).value || 'admin';
      const activo = f.activo ? f.activo.value === 'true' : true;
      try { await rpc('oficina_guardar_usuario', {p_token: TOKEN, p_usuario: u, p_nombre: f.nombre.value, p_rol: rol, p_clave: f.clave.value, p_activo: activo});
            toast('Usuario guardado'); cerrarHoja(true); USUARIOS = null; pintar(); }
      catch (err){ tratarError(err); }
    }
    if (f.id === 'fClaveForm'){
      try { await rpc('oficina_cambiar_mi_clave', {p_token: TOKEN, p_actual: f.actual.value, p_nueva: f.nueva.value}); f.reset(); toast('Contraseña cambiada'); }
      catch (err){ tratarError(err); }
    }
  } finally { if (boton) boton.disabled = false; }
});
$('#scrim').addEventListener('click', () => cerrarHoja());
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });
$('#btnEye').addEventListener('click', e => {
  const f = $('#fClave'), ver = f.type === 'password'; f.type = ver ? 'text' : 'password';
  e.currentTarget.setAttribute('aria-pressed', ver); e.currentTarget.querySelector('use').setAttribute('href', ver ? '#i-eye-off' : '#i-eye');
});
// El resumen se refresca solo cada minuto mientras está a la vista
setInterval(() => { if (TOKEN && !document.hidden && ruta().vista === 'resumen' && !ui.hoja) pintar(); }, 60000);

// ---------- Arranque ----------
if (TOKEN && YO){
  $('#login').hidden = true; $('#app').hidden = false;
  rpc('oficina_yo', {p_token: TOKEN}).then(y => { YO = y; store.set('gnv.oficina.yo', y); pintarNav();
    if (esAdmin()) rpc('oficina_usuarios', {p_token: TOKEN}).then(u => { USUARIOS = u; pintarNav(); }).catch(() => {}); }).catch(tratarError);
  pintar();
} else salir();
</script>
